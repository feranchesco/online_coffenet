{% extends "shared/layout.html" %}
{% load render_partial %}
{% block title %}کافی نت آنلاین{% endblock %}

{% block content %}

    <section id="homePage">
        <!-- ========== محتوای اصلی ========== -->
        <!-- ========== اخبار کناری (دسکتاپ) ========== -->
        <aside class="news-sidebar" id="newsSidebar">
            <div class="news-sidebar-header">
                <span>📰</span> اخبار روز
            </div>
            <div class="news-list" id="newsListContainer">
                <!-- اخبار با جاوااسکریپت پر می‌شوند -->
            </div>
        </aside>

        <!-- مودال اخبار موبایل -->
        <div class="news-mobile-modal" id="newsMobileModal">
            <div class="news-mobile-box">
                <div class="news-sidebar-header">
                    <span>📰</span> اخبار روز
                </div>
                <div class="news-list" id="newsMobileListContainer"></div>
                <button class="close-news-mobile" id="closeNewsMobileBtn">بستن</button>
            </div>
        </div>
        <div class="main-container">
            <header class="header">
                <div class="logo-icon">☕💻</div>
                <h1>کافی نت آنلاین</h1>
                <div class="subtitle">خدمات ردیفی با توضیحات سفارشی</div>
            </header>

            <!-- بخش کد تخفیف -->
            <div class="discount-section">
                <div class="discount-label">🏷️ کد تخفیف</div>
                <input type="text" class="discount-input" id="discountCodeInput"
                       placeholder="کد تخفیف خود را وارد کنید">
                <button class="discount-btn" id="applyDiscountBtn">اعمال</button>
            </div>

            <!-- خدمات ردیفی -->
            <div class="services-list" id="servicesListContainer"></div>
        </div>
            <!-- ========== مودال عمومی ========== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div style="font-size:2.5rem;" id="modalIcon">✨</div>
            <p id="modalMessage">پیام</p>
            <button class="close-modal" id="closeModalBtn">باشه</button>
        </div>
    </div>
    </section>
    {% block extra_js %}
    <script>
        // وضعیت احراز هویت کاربر از Django به جاوااسکریپت
        window.userAuthenticated = {% if user.is_authenticated %}true{% else %}false{% endif %};
    </script>
    {% endblock %}
{% endblock %}
