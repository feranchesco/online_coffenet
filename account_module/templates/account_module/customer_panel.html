<!-- templates/account_module/customer_panel.html -->
{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>پنل کاربری | کافی نت آنلاین</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Tahoma', 'Roboto', system-ui, sans-serif;
      background: linear-gradient(145deg, #0b0c1a 0%, #1a1c2e 50%, #0f101f 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1rem 1rem 7.5rem 1rem;
      position: relative;
      color: #fff;
      direction: rtl;
      -webkit-tap-highlight-color: transparent;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 15%, rgba(99, 102, 241, 0.18) 0%, transparent 50%),
                  radial-gradient(circle at 85% 75%, rgba(236, 72, 153, 0.13) 0%, transparent 55%);
      z-index: 0;
      pointer-events: none;
    }

    .main-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ----- هدر پنل ----- */
    .panel-header {
      background: rgba(22, 25, 42, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 2.5rem;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      box-shadow: 0 20px 35px -10px rgba(0,0,0,0.6);
      flex-wrap: wrap;
    }

    .user-avatar {
      width: 65px;
      height: 65px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      border: 3px solid rgba(255,255,255,0.3);
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
    }

    .user-info {
      flex: 1;
      min-width: 150px;
    }

    .user-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: #f3efff;
    }

    .user-phone {
      font-size: 0.85rem;
      color: #b9c2e6;
      margin-top: 0.2rem;
    }

    .user-status {
      display: inline-block;
      background: rgba(74, 222, 128, 0.2);
      color: #4ade80;
      padding: 0.3rem 0.9rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 0.4rem;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    /* ----- کارت کیف پول ----- */
    .wallet-card {
      background: rgba(22, 25, 42, 0.5);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 2rem;
      padding: 1.2rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 15px 30px -10px rgba(0,0,0,0.5);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .wallet-info {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .wallet-icon {
      font-size: 2.2rem;
      background: rgba(251, 191, 36, 0.15);
      width: 55px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .wallet-balance {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fbbf24;
    }

    .wallet-label {
      font-size: 0.8rem;
      color: #b9c2e6;
    }

    .wallet-btn {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border: none;
      color: #1a1c2e;
      font-weight: 700;
      padding: 0.7rem 1.5rem;
      border-radius: 2.5rem;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.25s;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .wallet-btn:hover {
      box-shadow: 0 8px 22px rgba(251, 191, 36, 0.5);
      transform: scale(1.03);
    }

    /* ----- تب‌ها ----- */
    .panel-tabs {
      display: flex;
      gap: 0.5rem;
      background: rgba(22, 25, 42, 0.4);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 2.5rem;
      padding: 0.5rem;
      border: 1px solid rgba(255,255,255,0.15);
      overflow-x: auto;
    }

    .tab-btn {
      flex: 1;
      min-width: 80px;
      background: transparent;
      border: none;
      color: #cfc8ff;
      padding: 0.7rem 1rem;
      border-radius: 2rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: 0.25s;
      white-space: nowrap;
      position: relative;
    }

    .tab-btn.active {
      background: rgba(139, 92, 246, 0.4);
      color: white;
      box-shadow: 0 5px 15px rgba(139, 92, 246, 0.3);
    }

    .tab-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    .tab-badge {
      position: absolute;
      top: -5px;
      left: 5px;
      background: #ef4444;
      color: white;
      font-size: 0.6rem;
      padding: 0.15rem 0.5rem;
      border-radius: 1rem;
      font-weight: 700;
      display: none;
    }

    /* ----- کارت سفارش ----- */
    .order-card {
      background: rgba(22, 25, 42, 0.5);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 2.5rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.55);
      transition: all 0.3s ease;
      margin-bottom: 1rem;
    }

    .order-card:hover {
      border-color: rgba(255,255,255,0.35);
      background: rgba(30, 34, 55, 0.6);
    }

    .order-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .order-icon {
      font-size: 2.2rem;
      background: rgba(255,255,255,0.1);
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .order-info {
      flex: 1;
      min-width: 120px;
    }

    .order-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: #f3efff;
    }

    .order-desc {
      font-size: 0.8rem;
      color: #b9c2e6;
    }

    .order-tracking {
      font-size: 0.7rem;
      color: #a78bfa;
      margin-top: 0.2rem;
    }

    .order-status {
      padding: 0.3rem 1rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-pending {
      background: rgba(251, 191, 36, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .status-progress {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .status-done {
      background: rgba(74, 222, 128, 0.2);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .status-cancelled {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* ----- اطلاعات اپراتور ----- */
    .operator-info {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      background: rgba(255,255,255,0.06);
      border-radius: 2rem;
      padding: 0.6rem 1rem;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .operator-avatar {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .operator-name {
      font-weight: 600;
      font-size: 0.85rem;
      color: #e4dcff;
    }

    .operator-role {
      font-size: 0.7rem;
      color: #a5b4fc;
    }

    /* ----- بخش چت ----- */
    .chat-section {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 1.8rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .chat-section::-webkit-scrollbar {
      width: 3px;
    }

    .chat-section::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
    }

    .chat-msg {
      padding: 0.6rem 1rem;
      border-radius: 1.2rem;
      font-size: 0.8rem;
      max-width: 85%;
      line-height: 1.5;
    }

    .chat-user {
      background: rgba(139, 92, 246, 0.3);
      align-self: flex-end;
      border-bottom-left-radius: 0.3rem;
    }

    .chat-operator {
      background: rgba(255,255,255,0.1);
      align-self: flex-start;
      border-bottom-right-radius: 0.3rem;
    }

    .chat-time {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.5);
      margin-top: 0.2rem;
      text-align: left;
    }

    .chat-input-row {
      display: flex;
      gap: 0.5rem;
    }

    .chat-input {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 2rem;
      padding: 0.6rem 1rem;
      color: white;
      font-size: 0.8rem;
      outline: none;
      font-family: inherit;
    }

    .chat-input::placeholder {
      color: rgba(255,255,255,0.4);
    }

    .chat-send-btn {
      background: #7c3aed;
      border: none;
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 2rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: 0.2s;
      white-space: nowrap;
    }

    .chat-send-btn:hover {
      background: #8b5cf6;
    }

    .chat-send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .chat-loading {
      text-align: center;
      color: #b9c2e6;
      font-size: 0.8rem;
      padding: 0.5rem;
    }

    /* ----- بخش پرداخت و دانلود ----- */
    .order-actions {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .pay-btn {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border: none;
      color: #1a1c2e;
      font-weight: 700;
      padding: 0.6rem 1.5rem;
      border-radius: 2.5rem;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.25s;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .pay-btn:hover {
      box-shadow: 0 8px 22px rgba(251, 191, 36, 0.5);
    }

    .pay-btn.paid {
      background: rgba(74, 222, 128, 0.25);
      color: #4ade80;
      cursor: default;
      border: 1px solid rgba(74, 222, 128, 0.4);
    }

    .pay-btn.paid:hover {
      box-shadow: none;
      transform: none;
    }

    .download-btn {
      background: linear-gradient(135deg, #4ade80, #22c55e);
      border: none;
      color: #1a1c2e;
      font-weight: 700;
      padding: 0.6rem 1.5rem;
      border-radius: 2.5rem;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.25s;
      border: 1px solid rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .download-btn:hover {
      box-shadow: 0 8px 22px rgba(74, 222, 128, 0.5);
      transform: scale(1.03);
    }

    .download-btn:disabled {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.3);
      cursor: not-allowed;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .download-btn:disabled:hover {
      box-shadow: none;
      transform: none;
    }

    .price-tag {
      font-weight: 700;
      color: #4ade80;
      font-size: 1rem;
    }

    /* ----- بخش تاریخچه ----- */
    .history-card {
      background: rgba(22, 25, 42, 0.45);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 2rem;
      padding: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      box-shadow: 0 10px 25px -8px rgba(0,0,0,0.4);
      margin-bottom: 0.8rem;
    }

    .history-icon {
      font-size: 1.8rem;
      background: rgba(255,255,255,0.08);
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .history-details {
      flex: 1;
    }

    .history-title {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .history-date {
      font-size: 0.7rem;
      color: #b9c2e6;
    }

    .history-price {
      font-weight: 700;
      color: #4ade80;
      font-size: 0.9rem;
    }

    /* ----- مودال ----- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      visibility: hidden;
      opacity: 0;
      transition: 0.25s;
    }

    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .modal-box {
      background: rgba(30,30,50,0.85);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 2.8rem;
      padding: 2rem;
      max-width: 350px;
      width: 90%;
      text-align: center;
      color: white;
    }

    .close-modal {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 0.7rem 2rem;
      border-radius: 3rem;
      margin-top: 1rem;
      cursor: pointer;
      font-weight: 600;
    }

    .modal-buttons {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .btn-confirm {
      background: #4ade80;
      border: none;
      color: #1a1c2e;
      padding: 0.7rem 2rem;
      border-radius: 2.5rem;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-cancel {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 0.7rem 2rem;
      border-radius: 2.5rem;
      cursor: pointer;
      font-weight: 600;
    }

    /* ----- نوار پایین ----- */
    .bottom-nav {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 2.5rem);
      max-width: 580px;
      background: rgba(18, 20, 35, 0.55);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 3.5rem;
      padding: 0.7rem 1rem;
      display: flex;
      justify-content: space-around;
      box-shadow: 0 25px 45px -12px rgba(0,0,0,0.8);
      z-index: 100;
    }

    .nav-item {
      background: transparent;
      border: none;
      color: #cfc8ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.7rem;
      cursor: pointer;
      padding: 0.4rem;
      border-radius: 2rem;
      min-width: 55px;
      text-decoration: none;
    }

    .nav-item span:first-child { font-size: 1.5rem; }
    .nav-item:hover { background: rgba(255,255,255,0.15); color: white; }
    .nav-item.active { background: rgba(139, 92, 246, 0.4); color: white; }

    /* دکمه برگشت */
    .back-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      background: rgba(30, 32, 50, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 12px 28px rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.3);
      color: #e9e0ff;
      cursor: pointer;
      z-index: 50;
      transition: 0.3s;
      text-decoration: none;
    }

    .back-btn:hover {
      transform: scale(1.1);
      background: rgba(139, 92, 246, 0.3);
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: #b9c2e6;
    }

    .empty-icon {
      font-size: 3.5rem;
      margin-bottom: 0.8rem;
    }

    .refresh-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      cursor: pointer;
      font-size: 0.8rem;
      margin-top: 0.5rem;
    }

    @media (max-width: 450px) {
      .panel-header { padding: 1.2rem; }
      .order-card { padding: 1.2rem; }
    }
  </style>
</head>
<body>
  <!-- دکمه برگشت -->
  <a href="/" class="back-btn" title="بازگشت به خانه">⬅️</a>

  <div class="main-container">
    <!-- هدر پنل کاربری -->
    <div class="panel-header">
      <div class="user-avatar">👤</div>
      <div class="user-info">
        <div class="user-name">{{ customer.full_name }}</div>
        <div class="user-phone">📱 {{ customer.phone }}</div>
        <div class="user-status">🟢 حساب فعال</div>
      </div>
    </div>

    <!-- کیف پول -->
    <div class="wallet-card">
      <div class="wallet-info">
        <div class="wallet-icon">💰</div>
        <div>
          <div class="wallet-balance" id="walletBalance">{{ customer.wallet_balance }} تومان</div>
          <div class="wallet-label">اعتبار کیف پول</div>
        </div>
      </div>
      <button class="wallet-btn" onclick="showModal('💳 افزایش اعتبار (به زودی)', '💰')">➕ شارژ</button>
    </div>

    <!-- تب‌ها -->
    <div class="panel-tabs">
      <button class="tab-btn active" data-tab="active">
        📋 سفارشات فعال
        <span class="tab-badge" id="activeBadge">0</span>
      </button>
      <button class="tab-btn" data-tab="completed">
        ✅ تکمیل شده
      </button>
      <button class="tab-btn" data-tab="history">
        📜 تاریخچه
      </button>
    </div>

    <!-- محتوای تب‌ها -->
    <div id="tabContent">
      <div class="chat-loading">⏳ در حال بارگذاری...</div>
    </div>
  </div>

  <!-- نوار پایین -->
  <nav class="bottom-nav">
    <button class="nav-item active"><span>📊</span><span>پنل</span></button>
    <a href="/" class="nav-item"><span>🏠</span><span>خانه</span></a>
    <a href="{% url 'customer_logout' %}" class="nav-item"><span>🚪</span><span>خروج</span></a>
  </nav>

  <!-- مودال عمومی -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div style="font-size:2.5rem;" id="modalIcon">✨</div>
      <p id="modalMessage">پیام</p>
      <button class="close-modal" id="closeModalBtn">باشه</button>
    </div>
  </div>

  <!-- مودال پرداخت -->
  <div class="modal-overlay" id="paymentModal">
    <div class="modal-box">
      <div style="font-size:2.5rem;">💳</div>
      <p id="paymentMessage"></p>
      <div class="modal-buttons">
        <button class="btn-confirm" id="confirmPaymentBtn">✅ پرداخت</button>
        <button class="btn-cancel" id="cancelPaymentBtn">انصراف</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // داده‌های اولیه از سرور
    // ============================================
    const servicesData = {{ services|safe }};
    const csrfToken = '{{ csrf_token }}';
    const customerId = '{{ customer.id }}';

    // ============================================
    // متغیرهای گلوبال
    // ============================================
    let currentTab = 'active';
    let currentPaymentServiceId = null;
    let chatIntervals = {};

    // ============================================
    // توابع مودال
    // ============================================
    function showModal(text, icon = '✨') {
      document.getElementById('modalMessage').textContent = text;
      document.getElementById('modalIcon').textContent = icon;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function hideModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function showPaymentModal(serviceId, price) {
      currentPaymentServiceId = serviceId;
      document.getElementById('paymentMessage').textContent =
        `پرداخت مبلغ ${Number(price).toLocaleString('fa-IR')} تومان برای این سفارش؟`;
      document.getElementById('paymentModal').classList.add('active');
    }

    function hidePaymentModal() {
      document.getElementById('paymentModal').classList.remove('active');
      currentPaymentServiceId = null;
    }

    // ============================================
    // توابع API
    // ============================================
    async function apiCall(url, options = {}) {
      try {
        const defaultOptions = {
          headers: {
            'X-CSRFToken': csrfToken,
            'Content-Type': 'application/json',
          }
        };
        const mergedOptions = { ...defaultOptions, ...options };
        if (mergedOptions.headers) {
          mergedOptions.headers = { ...defaultOptions.headers, ...options.headers };
        }

        const response = await fetch(url, mergedOptions);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'خطای ناشناخته');
        }

        return data;
      } catch (error) {
        console.error('API Error:', error);
        throw error;
      }
    }

    async function loadChatMessages(serviceId, page = 1) {
      try {
        const data = await apiCall(`/api/chat/${serviceId}/messages/?page=${page}`);
        return data;
      } catch (error) {
        return { messages: [], has_more: false, unread_count: 0 };
      }
    }

    async function sendChatMessage(serviceId, content) {
      return await apiCall(`/api/chat/${serviceId}/send/`, {
        method: 'POST',
        body: JSON.stringify({ content })
      });
    }

    async function markChatAsRead(serviceId) {
      try {
        await apiCall(`/api/chat/${serviceId}/read/`, { method: 'POST' });
      } catch (error) {
        // بی‌صدا خطا رو نادیده میگیریم
      }
    }

    async function payService(serviceId) {
      try {
        const data = await apiCall(`/api/service/${serviceId}/pay/`, {
          method: 'POST'
        });
        return data;
      } catch (error) {
        showModal('⚠️ ' + error.message, '❌');
        return { success: false };
      }
    }

    // ============================================
    // رندر کارت‌ها
    // ============================================
    function getStatusClass(status) {
      const classes = {
        'pending': 'status-pending',
        'accepted': 'status-progress',
        'in_progress': 'status-progress',
        'completed': 'status-done',
        'delivered': 'status-done',
        'cancelled': 'status-cancelled',
        'rejected': 'status-cancelled',
      };
      return classes[status] || 'status-pending';
    }

    function getStatusIcon(status) {
      const icons = {
        'pending': '⏳',
        'accepted': '✅',
        'in_progress': '⚙️',
        'completed': '🎉',
        'delivered': '📦',
        'cancelled': '❌',
        'rejected': '🚫',
      };
      return icons[status] || '❓';
    }

    function formatTime(timestamp) {
      if (!timestamp) return '';
      const date = new Date(timestamp);
      const now = new Date();
      const diff = now - date;

      if (diff < 60000) return 'همین الان';
      if (diff < 3600000) return Math.floor(diff / 60000) + ' دقیقه پیش';
      if (diff < 86400000) return Math.floor(diff / 3600000) + ' ساعت پیش';

      return date.toLocaleDateString('fa-IR', {
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function renderChatMessages(serviceId, messages) {
      if (!messages || messages.length === 0) {
        return '<div style="text-align:center;color:#b9c2e6;font-size:0.8rem;padding:0.5rem;">هنوز پیامی ارسال نشده</div>';
      }

      return messages.map(msg => {
        const isMine = msg.sender_id === customerId || msg.sender_type === 'customer';
        const msgClass = isMine ? 'chat-user' : 'chat-operator';
        return `
          <div class="chat-msg ${msgClass}">
            <div>${escapeHtml(msg.content)}</div>
            <div class="chat-time">${formatTime(msg.timestamp)}</div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ============================================
    // رندر تب‌ها
    // ============================================
    async function renderActiveOrders() {
      const activeServices = servicesData.filter(s =>
        ['pending', 'accepted', 'in_progress'].includes(s.status)
      );

      document.getElementById('activeBadge').textContent = activeServices.length;
      document.getElementById('activeBadge').style.display = activeServices.length > 0 ? 'block' : 'none';

      if (activeServices.length === 0) {
        document.getElementById('tabContent').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <p>هیچ سفارش فعالی ندارید</p>
            <a href="/" class="refresh-btn">➕ ایجاد سفارش جدید</a>
          </div>
        `;
        return;
      }

      let html = '';

      for (const service of activeServices) {
        // بارگذاری پیام‌های چت
        let chatData = { messages: [], has_more: false, unread_count: 0 };
        if (service.status !== 'pending') {
          chatData = await loadChatMessages(service.id);
        }

        const chatMessages = renderChatMessages(service.id, chatData.messages);
        const hasOperator = service.operator_name && service.status !== 'pending';

        html += `
          <div class="order-card" id="service-${service.id}">
            <div class="order-header">
              <div class="order-icon">${getStatusIcon(service.status)}</div>
              <div class="order-info">
                <div class="order-title">${escapeHtml(service.title)}</div>
                <div class="order-desc">${escapeHtml(service.description || '')}</div>
                <div class="order-tracking">کد پیگیری: ${service.tracking_code}</div>
              </div>
              <span class="order-status ${getStatusClass(service.status)}">${service.status_display}</span>
            </div>

            ${hasOperator ? `
              <div class="operator-info">
                <div class="operator-avatar">🧑‍💻</div>
                <div>
                  <div class="operator-name">${escapeHtml(service.operator_name)}</div>
                  ${service.operator_role ? `<div class="operator-role">${escapeHtml(service.operator_role)}</div>` : ''}
                </div>
              </div>
            ` : `
              <div class="operator-info">
                <div class="operator-avatar">⏳</div>
                <div>
                  <div class="operator-name">در انتظار پذیرش اپراتور</div>
                </div>
              </div>
            `}

            ${service.status !== 'pending' ? `
              <div class="chat-section" id="chatMessages-${service.id}">
                ${chatMessages}
              </div>
              <div class="chat-input-row">
                <input type="text"
                       class="chat-input"
                       id="chatInput-${service.id}"
                       placeholder="پیام خود را بنویسید..."
                       onkeypress="if(event.key==='Enter') sendMessage('${service.id}')">
                <button class="chat-send-btn" onclick="sendMessage('${service.id}')">📨 ارسال</button>
              </div>
            ` : `
              <div style="text-align:center;color:#b9c2e6;font-size:0.8rem;padding:0.5rem;">
                💬 چت پس از پذیرش سفارش توسط اپراتور فعال می‌شود
              </div>
            `}

            <div class="order-actions">
              <span class="price-tag">💲 ${Number(service.final_price).toLocaleString('fa-IR')} تومان</span>
              ${service.is_paid ? `
                <button class="pay-btn paid">✅ پرداخت شده</button>
              ` : `
                <button class="pay-btn" onclick="showPaymentModal('${service.id}', ${service.final_price})">💳 پرداخت</button>
              `}
              ${service.has_file && service.is_paid ? `
                <a href="/api/service/${service.id}/download/" class="download-btn" style="text-decoration:none;">📥 دانلود نتیجه</a>
              ` : service.has_file && !service.is_paid ? `
                <button class="download-btn" disabled>🔒 ابتدا پرداخت کنید</button>
              ` : service.status === 'completed' ? `
                <button class="download-btn" disabled>📥 منتظر آپلود فایل</button>
              ` : `
                <button class="download-btn" disabled>📥 در انتظار تکمیل</button>
              `}
            </div>
          </div>
        `;
      }

      document.getElementById('tabContent').innerHTML = html;

      // اسکرول چت‌ها به پایین
      document.querySelectorAll('.chat-section').forEach(el => {
        el.scrollTop = el.scrollHeight;
      });
    }

    async function renderCompletedOrders() {
      const completedServices = servicesData.filter(s =>
        ['completed', 'delivered'].includes(s.status)
      );

      if (completedServices.length === 0) {
        document.getElementById('tabContent').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <p>سفارش تکمیل شده‌ای ندارید</p>
          </div>
        `;
        return;
      }

      let html = '';

      for (const service of completedServices) {
        const chatData = await loadChatMessages(service.id);
        const chatMessages = renderChatMessages(service.id, chatData.messages.slice(-5));

        html += `
          <div class="order-card">
            <div class="order-header">
              <div class="order-icon">${getStatusIcon(service.status)}</div>
              <div class="order-info">
                <div class="order-title">${escapeHtml(service.title)}</div>
                <div class="order-desc">${escapeHtml(service.description || '')}</div>
                <div class="order-tracking">کد پیگیری: ${service.tracking_code}</div>
              </div>
              <span class="order-status ${getStatusClass(service.status)}">${service.status_display}</span>
            </div>

            <div class="operator-info">
              <div class="operator-avatar">🧑‍💻</div>
              <div>
                <div class="operator-name">${escapeHtml(service.operator_name || 'نامشخص')}</div>
                ${service.operator_role ? `<div class="operator-role">${escapeHtml(service.operator_role)}</div>` : ''}
              </div>
            </div>

            <div class="chat-section" style="max-height:120px;">
              ${chatMessages}
            </div>

            <div class="order-actions">
              <span class="price-tag">💲 ${Number(service.final_price).toLocaleString('fa-IR')} تومان</span>
              ${service.is_paid ? `
                <button class="pay-btn paid">✅ پرداخت شده</button>
                ${service.has_file ? `
                  <a href="/api/service/${service.id}/download/" class="download-btn" style="text-decoration:none;">📥 دانلود نتیجه</a>
                ` : ''}
              ` : `
                <button class="pay-btn" onclick="showPaymentModal('${service.id}', ${service.final_price})">💳 پرداخت</button>
                <button class="download-btn" disabled>🔒 ابتدا پرداخت کنید</button>
              `}
            </div>
          </div>
        `;
      }

      document.getElementById('tabContent').innerHTML = html;
    }

    function renderHistory() {
      const historyServices = servicesData.filter(s =>
        ['delivered', 'cancelled', 'rejected'].includes(s.status)
      );

      if (historyServices.length === 0) {
        document.getElementById('tabContent').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📜</div>
            <p>تاریخچه‌ای یافت نشد</p>
          </div>
        `;
        return;
      }

      document.getElementById('tabContent').innerHTML = historyServices.map(service => `
        <div class="history-card">
          <div class="history-icon">${getStatusIcon(service.status)}</div>
          <div class="history-details">
            <div class="history-title">${escapeHtml(service.title)}</div>
            <div class="history-date">📅 ${formatTime(service.created_at)} | ${service.status_display}</div>
          </div>
          <div class="history-price">${Number(service.final_price).toLocaleString('fa-IR')} تومان</div>
        </div>
      `).join('');
    }

    function switchTab(tab) {
      currentTab = tab;

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

      document.getElementById('tabContent').innerHTML = '<div class="chat-loading">⏳ در حال بارگذاری...</div>';

      switch(tab) {
        case 'active': renderActiveOrders(); break;
        case 'completed': renderCompletedOrders(); break;
        case 'history': renderHistory(); break;
      }
    }

    // ============================================
    // توابع چت
    // ============================================
    async function sendMessage(serviceId) {
      const input = document.getElementById(`chatInput-${serviceId}`);
      if (!input) return;

      const content = input.value.trim();
      if (!content) return;

      const sendBtn = input.nextElementSibling;
      input.disabled = true;
      if (sendBtn) sendBtn.disabled = true;

      try {
        const result = await sendChatMessage(serviceId, content);

        if (result.success) {
          input.value = '';
          // رفرش چت
          await refreshChat(serviceId);
        } else {
          showModal('⚠️ خطا در ارسال پیام', '❌');
        }
      } catch (error) {
        showModal('⚠️ خطا در ارسال پیام: ' + error.message, '❌');
      } finally {
        input.disabled = false;
        if (sendBtn) sendBtn.disabled = false;
        input.focus();
      }
    }

    async function refreshChat(serviceId) {
      const chatContainer = document.getElementById(`chatMessages-${serviceId}`);
      if (!chatContainer) return;

      try {
        const data = await loadChatMessages(serviceId);
        chatContainer.innerHTML = renderChatMessages(serviceId, data.messages);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      } catch (error) {
        console.error('Error refreshing chat:', error);
      }
    }

    // ============================================
    // پرداخت
    // ============================================
    async function confirmPayment() {
      if (!currentPaymentServiceId) return;

      try {
        const result = await payService(currentPaymentServiceId);

        if (result.success) {
          // آپدیت موجودی
          document.getElementById('walletBalance').textContent =
            Number(result.new_balance).toLocaleString('fa-IR') + ' تومان';

          // آپدیت سرویس در داده‌های محلی
          const service = servicesData.find(s => s.id === currentPaymentServiceId);
          if (service) {
            service.is_paid = true;
          }

          showModal('✅ پرداخت با موفقیت انجام شد!', '💳');
          hidePaymentModal();

          // رفرش تب فعلی
          switchTab(currentTab);
        }
      } catch (error) {
        showModal('⚠️ خطا در پرداخت: ' + error.message, '❌');
        hidePaymentModal();
      }
    }

    // ============================================
    // ایونت‌ها
    // ============================================
    document.getElementById('closeModalBtn').addEventListener('click', hideModal);
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modalOverlay')) hideModal();
    });

    document.getElementById('confirmPaymentBtn').addEventListener('click', confirmPayment);
    document.getElementById('cancelPaymentBtn').addEventListener('click', hidePaymentModal);
    document.getElementById('paymentModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('paymentModal')) hidePaymentModal();
    });

    // تب‌ها
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        switchTab(this.dataset.tab);
      });
    });

    // Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        hideModal();
        hidePaymentModal();
      }
    });

    // رفرش خودکار چت‌های فعال هر ۱۵ ثانیه
    setInterval(() => {
      if (currentTab === 'active') {
        document.querySelectorAll('.chat-section').forEach(el => {
          const serviceId = el.id.replace('chatMessages-', '');
          refreshChat(serviceId);
        });
      }
    }, 15000);

    // ============================================
    // لود اولیه
    // ============================================
    renderActiveOrders();

  </script>
</body>
</html>
