{% extends "shared/layout.html" %}

{% block title %}
	صفحه ثبت نام مشتری
{% endblock %}

{% block content %}
	<h1>به صفحه ثبت نام کاربر خوش آمدید</h1>
    <form action="{% url 'customer_signup' %}" method="post">
        {% csrf_token %}
        {% for field in form %}
        	{{ field }}
            {{ field.errors }}
            <br>
        {% endfor %}
        <button type="submit">ثبت نام کاربر</button>
    </form>
{% endblock %}
