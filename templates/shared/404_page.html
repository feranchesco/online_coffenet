<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>۴۰۴ - صفحه پیدا نشد</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Spline Viewer -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.48/build/spline-viewer.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');

        * {
            font-family: 'Vazirmatn', sans-serif;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            overflow-x: hidden;
        }

        .spotlight {
            position: absolute;
            top: -40px;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.1) 0%, transparent 50%);
            pointer-events: none;
            animation: spotlight 2s ease .75s 1 forwards;
        }

        @keyframes spotlight {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .gradient-text {
            background: linear-gradient(to bottom, #fafafa, #a3a3a3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .btn-primary {
            background: white;
            color: black;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background: #e5e5e5;
            transform: scale(1.02);
        }

        .btn-outline {
            background: transparent;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
            border: 1px solid #525252;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-outline:hover {
            background: #262626;
            border-color: #737373;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid #FFF;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .link-hover {
            transition: color 0.2s ease;
        }

        .link-hover:hover {
            color: white;
        }

        @media (max-width: 768px) {
            .btn-primary, .btn-outline {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div style="min-height: 100vh; background: rgba(0,0,0,0.96); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;">

        <!-- Spotlight Effect -->
        <div class="spotlight"></div>

        <!-- Main Container -->
        <div style="display: flex; flex-direction: column; width: 100%; max-width: 1280px; margin: 0 auto; padding: 2rem;">

            <!-- Spline 3D Scene -->
            <div style="flex: 1; min-height: 400px; position: relative; order: 1;">
                <div id="spline-container" style="width: 100%; height: 100%;">
                    <!-- Loading State -->
                    <div id="spline-loader" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
                        <span class="loader"></span>
                    </div>
                </div>
            </div>

            <!-- Persian Content -->
            <div style="flex: 1; padding: 2rem 1rem; position: relative; z-index: 10; display: flex; flex-direction: column; justify-content: center; order: 2;">
                <div style="text-align: center;">
                    <!-- 404 Number -->
                    <h1 class="gradient-text" style="font-size: 8rem; font-weight: 900; line-height: 1; margin-bottom: 1rem;">
                        ۴۰۴
                    </h1>

                    <!-- Title -->
                    <h2 style="font-size: 2rem; font-weight: 700; color: white; margin-bottom: 1rem;">
                        صفحه مورد نظر یافت نشد
                    </h2>

                    <!-- Description -->
                    <p style="color: #d4d4d4; font-size: 1.1rem; line-height: 1.8; max-width: 28rem; margin: 0 auto 2rem auto;">
                        متأسفانه صفحه‌ای که به دنبال آن هستید وجود ندارد یا منتقل شده است.
                        لطفاً از طریق گزینه‌های زیر اقدام کنید.
                    </p>

                    <!-- Action Buttons -->
                    <div style="display: flex; flex-direction: column; gap: 1rem; max-width: 24rem; margin: 0 auto;">
                        <a href="/" style="text-decoration: none;">
                            <button class="btn-primary" style="width: 100%; justify-content: center;">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                                </svg>
                                بازگشت به خانه
                            </button>
                        </a>

                        <a href="/search" style="text-decoration: none;">
                            <button class="btn-outline" style="width: 100%; justify-content: center;">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <path d="m21 21-4.3-4.3"></path>
                                </svg>
                                جستجو در سایت
                            </button>
                        </a>
                    </div>

                    <!-- Quick Links -->
                    <div style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid #262626;">
                        <h3 style="color: #a3a3a3; font-size: 0.875rem; margin-bottom: 1rem;">
                            صفحات پیشنهادی:
                        </h3>
                        <div style="display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center;">
                            <a href="/about" class="link-hover" style="color: #a3a3a3; text-decoration: none; font-size: 0.875rem; display: flex; align-items: center; gap: 0.25rem;">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M5 12h14"></path>
                                    <path d="m12 5 7 7-7 7"></path>
                                </svg>
                                درباره ما
                            </a>
                            <a href="/contact" class="link-hover" style="color: #a3a3a3; text-decoration: none; font-size: 0.875rem; display: flex; align-items: center; gap: 0.25rem;">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M5 12h14"></path>
                                    <path d="m12 5 7 7-7 7"></path>
                                </svg>
                                تماس با ما
                            </a>
                            <a href="/blog" class="link-hover" style="color: #a3a3a3; text-decoration: none; font-size: 0.875rem; display: flex; align-items: center; gap: 0.25rem;">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M5 12h14"></path>
                                    <path d="m12 5 7 7-7 7"></path>
                                </svg>
                                وبلاگ
                            </a>
                            <a href="/faq" class="link-hover" style="color: #a3a3a3; text-decoration: none; font-size: 0.875rem; display: flex; align-items: center; gap: 0.25rem;">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M5 12h14"></path>
                                    <path d="m12 5 7 7-7 7"></path>
                                </svg>
                                سوالات متداول
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load Spline 3D Scene
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('spline-container');
            const loader = document.getElementById('spline-loader');

            // Create spline-viewer element
            const viewer = document.createElement('spline-viewer');
            viewer.setAttribute('url', 'https://prod.spline.design/kZDDjO5HuC9GJUM2/scene.splinecode');
            viewer.style.width = '100%';
            viewer.style.height = '100%';
            viewer.style.display = 'none';

            // Handle load event
            viewer.addEventListener('load', () => {
                if (loader) {
                    loader.style.display = 'none';
                }
                viewer.style.display = 'block';
            });

            // Handle error
            viewer.addEventListener('error', () => {
                if (loader) {
                    loader.innerHTML = '<p style="color: white; text-align: center;">خطا در بارگذاری صحنه سه بعدی</p>';
                }
            });

            // Add to container
            container.appendChild(viewer);

            // Fallback: Show after 5 seconds even if load event doesn't fire
            setTimeout(() => {
                if (loader && loader.style.display !== 'none') {
                    loader.style.display = 'none';
                    viewer.style.display = 'block';
                }
            }, 5000);
        });
    </script>
</body>
</html>
