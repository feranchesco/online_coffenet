<!-- templates/order_module/payment.html -->
{% extends "shared/layout.html" %}
{% load static %}

{% block title %}پرداخت | کافی نت آنلاین{% endblock %}

{% block content %}
<a href="{% url 'profile' %}" class="back-btn" title="بازگشت">⬅️</a>

<div class="main-container" style="margin-top:4rem;">
    <div class="order-card">
        <div class="order-header">
            <div class="order-icon">💳</div>
            <div class="order-info">
                <div class="order-title">{{ service.title }}</div>
                <div class="order-desc">{{ service.description }}</div>
            </div>
        </div>

        <div style="text-align:center;padding:1rem;">
            <div style="font-size:2rem;color:#4ade80;font-weight:700;">
                {{ amount|floatformat:0 }} تومان
            </div>
            <div style="color:#b9c2e6;margin-top:0.5rem;">مبلغ قابل پرداخت</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:0.8rem;">
            <a href="{% url 'send_to_gateway' service.id %}"
               class="pay-btn"
               style="text-align:center;text-decoration:none;display:block;padding:1rem;font-size:1rem;">
                💳 پرداخت با درگاه بانکی
            </a>

            <button onclick="payFromWallet('{{ service.id }}')"
                    class="wallet-btn"
                    style="padding:1rem;font-size:1rem;width:100%;">
                💰 پرداخت از کیف پول
            </button>
        </div>

        <!-- کد تخفیف -->
        <div class="discount-section" style="margin-top:1rem;">
            <div class="discount-label">🏷️ کد تخفیف</div>
            <input type="text" class="discount-input" id="discountCode" placeholder="کد تخفیف خود را وارد کنید">
            <button class="discount-btn" onclick="applyDiscount()">اعمال</button>
        </div>
    </div>
</div>

<script>
const csrfToken = '{{ csrf_token }}';
const serviceId = '{{ service.id }}';

async function payFromWallet(serviceId) {
    if (!confirm('آیا از پرداخت از کیف پول مطمئن هستید؟')) return;

    try {
        const response = await fetch(`/pay/wallet/${serviceId}/`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': csrfToken,
                'Content-Type': 'application/json',
            }
        });

        const data = await response.json();

        if (data.success) {
            alert('✅ پرداخت با موفقیت انجام شد!');
            window.location.href = '/panel/';
        } else {
            alert('⚠️ ' + (data.error || 'خطا در پرداخت'));
        }
    } catch (error) {
        alert('⚠️ خطا در ارتباط با سرور');
    }
}

async function applyDiscount() {
    const code = document.getElementById('discountCode').value.trim();
    if (!code) return alert('کد تخفیف را وارد کنید');

    try {
        const formData = new FormData();
        formData.append('code', code);

        const response = await fetch(`/pay/discount/${serviceId}/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': csrfToken },
            body: formData
        });

        const data = await response.json();

        if (data.success) {
            location.reload();
        } else {
            alert('⚠️ ' + (data.error || 'کد تخفیف نامعتبر'));
        }
    } catch (error) {
        alert('⚠️ خطا در اعمال کد تخفیف');
    }
}
</script>
{% endblock %}
