<!-- templates/order_module/payment_result.html -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نتیجه پرداخت</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(145deg, #0b0c1a, #1a1c2e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            direction: rtl;
        }
        .result-box {
            background: rgba(30,30,50,0.9);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2rem;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .success-icon { font-size: 4rem; }
        .ref-id { color: #4ade80; font-size: 1.2rem; margin: 1rem 0; }
        .amount { color: #fbbf24; font-size: 1.5rem; }
        .btn {
            display: inline-block;
            background: #7c3aed;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 2rem;
            text-decoration: none;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="result-box">
        {% if success %}
            <div class="success-icon">✅</div>
            <h2>پرداخت موفق</h2>
            <div class="ref-id">کد پیگیری: {{ ref_id }}</div>
            <div class="amount">{{ amount }} تومان</div>
            <p>سرویس شما با موفقیت پرداخت شد</p>
        {% else %}
            <div class="success-icon">❌</div>
            <h2>پرداخت ناموفق</h2>
            <p>متاسفانه پرداخت با خطا مواجه شد</p>
        {% endif %}
        <a href="{% url 'profile' %}" class="btn">بازگشت به پنل</a>
    </div>
</body>
</html>
